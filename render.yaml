databases:
  - name: signflow-db
    plan: free
    region: frankfurt
    databaseName: signflow
    user: signflow
    postgresMajorVersion: 16

services:
  - type: web
    name: signflow
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.cloud
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: FILESYSTEM_DISK
        value: local
      - key: QUEUE_CONNECTION
        value: sync
      - key: CACHE_STORE
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_NAME
        value: SignFlow
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_TENANT_ID
        sync: false
      - key: RUN_SEED
        value: "true"
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      - key: DATABASE_URL
        fromDatabase:
          name: signflow-db
          property: connectionString
      - key: DB_HOST
        fromDatabase:
          name: signflow-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: signflow-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: signflow-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: signflow-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: signflow-db
          property: password
